name: CI

on:
  # Every pull request, whatever it targets. The previous `branches: [main, prod]` filter
  # meant a PR into a feature branch ran nothing at all, and reported "no checks" rather
  # than a failure — so an unverified PR looked the same as a passing one.
  #
  # That shape comes up when a review-fix branch is opened against the feature branch it
  # fixes rather than against main (PR #56 onto #36 was the first). Under the old filter
  # the first CI run over that code happened only after it had already been merged once.
  pull_request:

jobs:
  smoke-test:
    name: Migrations + API smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: triangle_shows
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/triangle_shows
      ENABLE_SCHEDULER: "false"
      ENABLE_STARTUP_SCRAPE: "false"
      TICKETMASTER_API_KEY: ""
      APP_ENV: ci
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start API server
        working-directory: backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for API and check health
        run: |
          curl \
            --retry 15 \
            --retry-delay 1 \
            --retry-connrefused \
            --fail \
            --silent \
            --show-error \
            http://localhost:8000/api/health
