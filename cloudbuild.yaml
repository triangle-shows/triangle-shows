# Cloud Build CI/CD pipeline for triangle-shows
#
# INITIAL SETUP (run once before first deploy):
#
#   1. Create Artifact Registry repository:
#      gcloud artifacts repositories create triangle-shows \
#        --repository-format=docker --location=us-east1
#
#   2. Create secrets in Secret Manager:
#      gcloud secrets create triangle-shows-db-url \
#        --data-file=- <<< "postgresql+asyncpg://user:pass@host/dbname"
#      gcloud secrets create triangle-shows-tm-api-key \
#        --data-file=- <<< "your_ticketmaster_api_key"
#
#      # Admin subsite (/admin) — REQUIRED before enabling the admin secrets in the
#      # deploy step below, or the deploy will fail on a missing secret:
#      gcloud secrets create triangle-shows-admin-password \
#        --data-file=- <<< "a-strong-admin-password"
#      openssl rand -base64 32 | gcloud secrets create triangle-shows-session-secret --data-file=-
#
#   3. Grant the Cloud Build service account permission to deploy to Cloud Run
#      and access secrets (in IAM Console, or):
#      PROJECT_NUM=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:$PROJECT_NUM@cloudbuild.gserviceaccount.com" \
#        --role="roles/run.admin"
#      gcloud projects add-iam-policy-binding $PROJECT_ID \
#        --member="serviceAccount:$PROJECT_NUM@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#      gcloud iam service-accounts add-iam-policy-binding \
#        $PROJECT_NUM-compute@developer.gserviceaccount.com \
#        --member="serviceAccount:$PROJECT_NUM@cloudbuild.gserviceaccount.com" \
#        --role="roles/iam.serviceAccountUser"
#
#   4. Create Cloud Scheduler job for periodic scrapes:
#      gcloud scheduler jobs create http triangle-shows-scrape \
#        --schedule="0 */6 * * *" \
#        --uri="https://YOUR_CLOUD_RUN_URL/api/scrape" \
#        --http-method=POST \
#        --location=us-east1 \
#        --oidc-service-account-email=YOUR_SA@PROJECT_ID.iam.gserviceaccount.com
#
# TO RUN MANUALLY:
#   gcloud builds submit --config cloudbuild.yaml
#
# TO CONNECT A GITHUB TRIGGER:
#   Cloud Build console → Triggers → Connect Repository → set trigger on push to prod
#   (`prod` is the deploy branch; `main` is the default/integration branch and does not
#   deploy. See .github/CONTRIBUTING.md for the promotion workflow.)

substitutions:
  _REGION: us-east1
  _SERVICE: triangle-shows
  _REPO: triangle-shows  # Artifact Registry repository name

steps:
  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --build-arg=GIT_COMMIT=$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api:latest
      - .

  # Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api

  # Deploy to Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    id: deploy
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api:$COMMIT_SHA
      - --platform=managed
      - --region=$_REGION
      - --port=8000
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=300
      # Origin gates (backend/app/tokens.py) are OFF until these env vars are set, and
      # the boot log says which are live on every start. None of these values is a
      # secret — a team domain, an application id, and a service-account email — so they
      # belong here rather than in Secret Manager.
      #
      # Turn them on by extending the line below in place. gcloud rejects
      # --set-env-vars alongside --update-env-vars, so append rather than adding a line:
      #
      #   - --set-env-vars=APP_ENV=production,ENABLE_SCHEDULER=false,ENABLE_STARTUP_SCRAPE=false,LOG_LEVEL=INFO,CF_ACCESS_TEAM_DOMAIN=<team>.cloudflareaccess.com,CF_ACCESS_AUD=<aud-tag>,SCRAPE_ALLOWED_SERVICE_ACCOUNTS=<scheduler-sa-email>,SCRAPE_OIDC_AUDIENCE=<audience-on-the-scheduler-job>
      #
      # Enable the scrape gate first: its token already arrives, so it can be verified
      # with nothing else in place. The /admin gate needs a Cloudflare Access application
      # to exist first, or /admin becomes unreachable — which is safe (it fails closed)
      # but not useful.
      # ENABLE_STARTUP_SCRAPE=false because the on-boot scrape cannot work reliably here.
      # It runs as a detached asyncio task, and this service has no CPU-throttling
      # override, so Cloud Run allocates CPU only while a request is in flight. The task
      # is therefore starved the moment startup finishes: on the 2026-08-27 release it
      # deleted ~98 rows in dribs over five minutes as health checks briefly granted CPU,
      # never reached the reclassify pass at the end, and emitted no stdout at all — so
      # the live-music filter shipped classifying nothing, and there were no logs to say
      # so. Cloud Scheduler already calls POST /api/scrape every 6 hours, inside a real
      # request where CPU is allocated, which is where a scrape belongs.
      #
      # The alternative is --no-cpu-throttling, which keeps CPU allocated on idle
      # instances and costs more for work the scheduler already does deterministically.
      - --set-env-vars=APP_ENV=production,ENABLE_SCHEDULER=false,LOG_LEVEL=INFO,ENABLE_STARTUP_SCRAPE=false,SCRAPE_ALLOWED_SERVICE_ACCOUNTS=triangle-shows-scrape@triangle-shows.iam.gserviceaccount.com,SCRAPE_OIDC_AUDIENCE=https://triangle-shows.net/api/scrape
      - --update-secrets=DATABASE_URL=triangle-shows-db-url:latest
      - --update-secrets=TICKETMASTER_API_KEY=triangle-shows-tm-api-key:latest
      # Admin subsite — uncomment BOTH lines only after creating the two secrets
      # above (see step 2). Without them the /admin login is disabled (fails closed),
      # so leaving these commented is safe; the rest of the site is unaffected.
      # - --update-secrets=ADMIN_PASSWORD=triangle-shows-admin-password:latest
      # - --update-secrets=SESSION_SECRET=triangle-shows-session-secret:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/api:latest

options:
  logging: CLOUD_LOGGING_ONLY
